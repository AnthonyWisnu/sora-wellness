services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-wellness}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-wellness}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - wellness_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-wellness} -d ${DB_NAME:-wellness}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wellness_pgdata:
